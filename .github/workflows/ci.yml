name: CI
on:
  push:
    branches:
      - master
      - release-*
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
      fail-fast: false
    steps:
      - name: Check for secrets
        env:
          SECRETS_AVAILABLE: ${{ secrets.SECRETS_AVAILABLE }}
        run: exit $(If ($env:SECRETS_AVAILABLE -eq 'true') { 0 } Else { 1 })
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.2.0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build src --configuration Release
        background: true
      - parallel:
        - name: Install SQL Server
          uses: Particular/install-sql-server-action@v3.0.0
          with:
            connection-string-env-var: SqlServerTransportConnectionString
            catalog: nservicebus
            enable-distributed-transactions: true
        - name: Setup PostgreSQL
          uses: Particular/setup-postgres-action@v3.0.0
          with:
            connection-string-name: PostgreSqlTransportConnectionString
            init-script: './.github/workflows/scripts/init-postgres.sql'
            registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
            registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Wait for build
        wait: build
      - name: Upload packages
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NuGet packages
          path: nugets/
          retention-days: 7
      - name: Prepare SQL Server
        run: |
          echo "Create extra databases"
          sqlcmd -Q "CREATE DATABASE nservicebus1"
          sqlcmd -Q "CREATE DATABASE nservicebus2"
          sqlcmd -Q "CREATE DATABASE [n service.bus&#]"

          echo "Create additional schemas"
          sqlcmd -Q "CREATE SCHEMA receiver AUTHORIZATION db_owner" -d "nservicebus"
          sqlcmd -Q "CREATE SCHEMA sender AUTHORIZATION db_owner" -d "nservicebus"
          sqlcmd -Q "CREATE SCHEMA db@ AUTHORIZATION db_owner" -d "nservicebus"
      - parallel:
        - name: Run SQL Server tests
          uses: Particular/run-tests-action@v1.9.0
          with:
            projects: |
              src/NServiceBus.Transport.SqlServer.AcceptanceTests/NServiceBus.Transport.SqlServer.AcceptanceTests.csproj
              src/NServiceBus.Transport.SqlServer.IntegrationTests/NServiceBus.Transport.SqlServer.IntegrationTests.csproj
              src/NServiceBus.Transport.SqlServer.TransportTests/NServiceBus.Transport.SqlServer.TransportTests.csproj
              src/NServiceBus.Transport.SqlServer.UnitTests/NServiceBus.Transport.SqlServer.UnitTests.csproj
        - name: Run PostgreSQL tests
          uses: Particular/run-tests-action@v1.9.0
          with:
            projects: |
              src/NServiceBus.Transport.PostgreSql.AcceptanceTests/NServiceBus.Transport.PostgreSql.AcceptanceTests.csproj
              src/NServiceBus.Transport.PostgreSql.TransportTests/NServiceBus.Transport.PostgreSql.TransportTests.csproj
              src/NServiceBus.Transport.PostgreSql.UnitTests/NServiceBus.Transport.PostgreSql.UnitTests.csproj
